<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sample news page with ads</title>
    <script src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
    <script src="https://aax-eu.amazon-adsystem.com/sdk/cf/amzn-ads.js"></script>
    <script src="https://cdn.example.com/app.js"></script>
</head>
<body>
    <article>
        <h1>A normal article</h1>
        <p>The story is about the weather and a local market that reopened.</p>
        <a href="https://example.com/news/market-reopens">Read the full story</a>
        <a href="https://example.com/about">About us</a>
    </article>

    <aside id="sponsored">
        <h2>Sponsored</h2>
        <a href="https://www.taboola.com/partners">You might also like</a>
        <a href="https://www.outbrain.com/amplify-ads">More reads</a>
    </aside>

    <section class="ads">
        <img src="https://cdn.adnxs.com/slot/728x90-1.png" alt="ad">
        <img src="https://banner.openx.net/promo/mobile-320x50.png" alt="ad">
        <img src="https://pixel.criteo.com/sync?type=iframe" alt="ad">
        <img src="https://images.example.com/hero-rectangle.jpeg" alt="photo">
    </section>

    <iframe src="https://soa.pubmatic.com/soa/mega/adsrv"></iframe>

    <script src="https://cdn.example.com/tracker.js"></script>
</body>
</html>
